name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.16-alpine3.24@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
        env:
          POSTGRES_USER: twitch_tracker
          POSTGRES_PASSWORD: twitch_tracker_test
          POSTGRES_DB: twitch_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twitch_tracker -d twitch_tracker_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://twitch_tracker:twitch_tracker_test@localhost:5432/twitch_tracker_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install pinned pnpm
        run: npm install --global pnpm@12.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source and configuration
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" pnpm --filter @twitch-tracker/db db:migrate
          pnpm check:structure
          pnpm lint
          pnpm test
          pnpm typecheck
          pnpm build
          pnpm audit --prod
          pnpm audit
          docker compose --env-file .env.production.example config --quiet
          for script in infra/postgres/*.sh; do sh -n "$script"; done
          sh infra/postgres/backup-retention.test.sh
          sh infra/postgres/backup-retry.test.sh

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production images
        run: docker compose --env-file .env.production.example build --pull

      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          -e PUBLIC_DOMAIN=tracker.example.com
          -e CADDY_EMAIL=operations@example.com
          -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
          caddy validate --config /etc/caddy/Caddyfile
