name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source and configuration
        run: |
          pnpm check:structure
          pnpm lint
          pnpm test
          pnpm typecheck
          pnpm build
          pnpm audit --prod
          pnpm audit
          docker compose --env-file .env.production.example config --quiet
          sh -n infra/postgres/backup.sh
          sh -n infra/postgres/restore.sh

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production images
        run: docker compose --env-file .env.production.example build --pull

      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          -e PUBLIC_DOMAIN=tracker.example.com
          -e CADDY_EMAIL=operations@example.com
          -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          caddy validate --config /etc/caddy/Caddyfile
