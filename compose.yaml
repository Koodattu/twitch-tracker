x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-node-security: &node-security
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 45s
  logging: *default-logging

x-app-environment: &app-environment
  APP_MODE: production
  PUBLIC_WEB_URL: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
  PUBLIC_API_URL: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
  INTERNAL_API_URL: http://api:4000
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
  COOKIE_SECURE: "true"
  TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:?Set TWITCH_CLIENT_ID}
  TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:?Set TWITCH_CLIENT_SECRET}
  TWITCH_OAUTH_REDIRECT_URI: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}/api/auth/twitch/callback
  TWITCH_LOGIN_SCOPES: ${TWITCH_LOGIN_SCOPES:-}
  TWITCH_EVENTSUB_SECRET: ${TWITCH_EVENTSUB_SECRET:?Set TWITCH_EVENTSUB_SECRET}
  EVENTSUB_ENABLED: ${EVENTSUB_ENABLED:-false}
  EVENTSUB_MAX_CHANNELS: ${EVENTSUB_MAX_CHANNELS:-25}
  TWITCH_BOT_OAUTH_REDIRECT_URI: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}/api/internal/bot-accounts/oauth/callback
  TWITCH_BOT_SCOPES: ${TWITCH_BOT_SCOPES:-chat:read user:read:chat user:read:moderated_channels moderator:read:chatters}
  ADMIN_TWITCH_USER_IDS: ${ADMIN_TWITCH_USER_IDS:?Set ADMIN_TWITCH_USER_IDS}
  ADMIN_TWITCH_LOGINS: ${ADMIN_TWITCH_LOGINS:-}
  ENABLE_TWITCH_INGESTION: ${ENABLE_TWITCH_INGESTION:-false}
  DEFAULT_BOT_JOIN_CAPACITY: ${DEFAULT_BOT_JOIN_CAPACITY:-100}
  DEFAULT_BOT_JOIN_RATE_PER_10_SECONDS: ${DEFAULT_BOT_JOIN_RATE_PER_10_SECONDS:-20}
  DISCOVERY_INTERVAL_MS: ${DISCOVERY_INTERVAL_MS:-180000}
  USER_HYDRATION_INTERVAL_MS: ${USER_HYDRATION_INTERVAL_MS:-300000}
  ASSIGNMENT_INTERVAL_MS: ${ASSIGNMENT_INTERVAL_MS:-30000}
  CHATTERS_RECONCILIATION_INTERVAL_MS: ${CHATTERS_RECONCILIATION_INTERVAL_MS:-300000}
  CHATTERS_RECONCILIATION_MAX_CHANNELS: ${CHATTERS_RECONCILIATION_MAX_CHANNELS:-25}
  CHATTERS_RECONCILIATION_MAX_PAGES_PER_CHANNEL: ${CHATTERS_RECONCILIATION_MAX_PAGES_PER_CHANNEL:-5}
  AGGREGATION_INTERVAL_MS: ${AGGREGATION_INTERVAL_MS:-60000}
  AGGREGATION_BUCKET_MINUTES: ${AGGREGATION_BUCKET_MINUTES:-5}
  AGGREGATION_LOOKBACK_HOURS: ${AGGREGATION_LOOKBACK_HOURS:-48}
  MAINTENANCE_INTERVAL_MS: ${MAINTENANCE_INTERVAL_MS:-300000}
  RAW_CHAT_RETENTION_DAYS: ${RAW_CHAT_RETENTION_DAYS:-30}
  RAW_PAYLOAD_RETENTION_DAYS: ${RAW_PAYLOAD_RETENTION_DAYS:-30}
  STALE_ASSIGNMENT_GRACE_MINUTES: ${STALE_ASSIGNMENT_GRACE_MINUTES:-15}
  BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}

services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    pull_policy: always
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  web:
    <<: *node-security
    image: twitch-tracker-web:${IMAGE_TAG:?Set IMAGE_TAG to an immutable release ID}
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VCS_REF: ${VCS_REF:?Set VCS_REF to the Git commit}
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://api:4000
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/web/.next/cache:size=128m,uid=1000,gid=1000,mode=0750
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    <<: *node-security
    image: twitch-tracker-api:${IMAGE_TAG:?Set IMAGE_TAG to an immutable release ID}
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      args:
        VCS_REF: ${VCS_REF:?Set VCS_REF to the Git commit}
    restart: unless-stopped
    environment:
      <<: *app-environment
      PORT: 4000
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - edge
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *node-security
    image: twitch-tracker-worker:${IMAGE_TAG:?Set IMAGE_TAG to an immutable release ID}
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
      args:
        VCS_REF: ${VCS_REF:?Set VCS_REF to the Git commit}
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      <<: *app-environment
      WORKER_NAME: ${WORKER_NAME:-worker-1}
      WORKER_HEALTH_MAX_AGE_MS: ${WORKER_HEALTH_MAX_AGE_MS:-900000}
      WORKER_EXPECTED_LOOP_COUNT: "8"
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "dist/health.js"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 5m

  postgres:
    image: postgres:16.14-alpine3.24@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    pull_policy: always
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  migrate:
    <<: *node-security
    image: twitch-tracker-migrate:${IMAGE_TAG:?Set IMAGE_TAG to an immutable release ID}
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
      args:
        VCS_REF: ${VCS_REF:?Set VCS_REF to the Git commit}
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  backup:
    image: postgres:16.14-alpine3.24@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    pull_policy: always
    restart: unless-stopped
    init: true
    user: "70:70"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    command: ["/bin/sh", "/scripts/backup.sh"]
    volumes:
      - ./infra/postgres:/scripts:ro
      - type: bind
        source: ${BACKUP_HOST_PATH:?Set BACKUP_HOST_PATH to an off-host mounted directory}
        target: /backups
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-s", "/backups/.last-success"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 5m
    logging: *default-logging

networks:
  edge:
  backend:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
