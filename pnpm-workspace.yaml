packages:
  - "apps/*"
  - "packages/*"

injectWorkspacePackages: true

syncInjectedDepsAfterScripts:
  - build

allowBuilds:
  esbuild: true
  unrs-resolver: true

overrides:
  "@esbuild-kit/core-utils>esbuild": 0.28.2
  # Legacy lint plugins require the callable CommonJS export.
  minimatch: 11.0.9
  "@next/eslint-plugin-next@16.4.6>fast-glob": npm:tinyglobby@0.2.17

patchedDependencies:
  '@next/eslint-plugin-next@16.4.6': patches/@next__eslint-plugin-next@16.4.6.patch
  minimatch@11.0.9: patches/minimatch@11.0.9.patch

minimumReleaseAgeExclude:
  - "@vitest/mocker@5.1.1"
  - "@vitest/spy@5.1.1"
  - vitest@5.1.1
