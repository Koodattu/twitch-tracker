packages:
  - "apps/*"
  - "packages/*"

injectWorkspacePackages: true

syncInjectedDepsAfterScripts:
  - build

allowBuilds:
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - pg-protocol@1.16.0
  - pg@8.23.1

overrides:
  # Patched matcher; its CJS export patch preserves legacy lint-plugin calls.
  minimatch: 11.0.4
  "@esbuild-kit/core-utils>esbuild": 0.25.0
  "brace-expansion@5.0.9": 5.0.12
  "source-map-js@1.2.1": 1.2.2
  "vite@>=8.2.0 <=8.2.3": 8.2.4
  # This plugin only uses globSync for root directories. Pair the alias with
  # its path/expandDirectories patch until upstream removes vulnerable braces.
  "@next/eslint-plugin-next@16.3.8>fast-glob": npm:tinyglobby@0.2.17

patchedDependencies:
  '@next/eslint-plugin-next@16.3.8': patches/@next__eslint-plugin-next@16.3.8.patch
  minimatch@11.0.4: patches/minimatch@11.0.4.patch
